# Game Mode (none=0, guesser=1, extraction=2)
mode=1

# Show the compass at the top of the screen (0=off, 1=on)
show-compass=1

# Show the in-game time at the top right of the screen (0=off, 1=on)
show-time=1

# Show a circle cross in the center of the screen against motion sickness (0=off, 1=on)
show-crosshair=1

# Time Limit (off, auto, 60=60 seconds)
time-limit-seconds=off

